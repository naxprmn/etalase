limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
server_tokens off;

server {
    listen 80;
    server_name localhost;
    client_max_body_size 8m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Block internal mock test routes from public access
    location /api/mock/ {
        return 404;
    }

    # Apply rate limiting to all public API endpoints
    location /api/ {
        # Exempt internal/service endpoints from rate limit if needed,
        # but since service endpoints have token auth, we can just apply rate limit globally
        # or separate them. Let's apply limit to the public read endpoints.
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://alas-app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://alas-app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
