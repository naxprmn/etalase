# Batas laju per IP klien (ADR-0012). API publik paling ketat; Service API (satu pengirim: Lawet Hub,
# sudah berbearer + HMAC) dan proxy media panel (satu halaman dapat memuat puluhan foto) punya zona sendiri.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=media_limit:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=service_limit:10m rate=1200r/m;
# Melebihi batas dijawab 429 (bukan 503) agar pengirim dapat membedakannya dari galat server dan mencoba lagi.
limit_req_status 429;
server_tokens off;

server {
    listen 80;
    server_name localhost;
    # Harus > batas dokumen PDF di Lawet Hub (10MB) + overhead multipart server action.
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Block internal mock test routes from public access
    location /api/mock/ {
        return 404;
    }

    # Direct Service API dari Lawet Hub: batch outbox 20 event per 15 detik plus bacaan, dari satu IP.
    location /api/service/ {
        limit_req zone=service_limit burst=200 nodelay;
        proxy_pass http://alas-app:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy media terlindungi untuk panel (butuh login): halaman jurnal memuat banyak foto sekaligus.
    location /api/v1/jurnal-alas/media/ {
        limit_req zone=media_limit burst=100 nodelay;
        proxy_pass http://alas-app:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API publik (baca): batas paling ketat.
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://alas-app:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://alas-app:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
